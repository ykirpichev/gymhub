# Self-contained grader images (issue #132, docs/design/worker-v2.md §5): the graders inside, so a
# pool machine needs no repo checkout and no venv. gymhub/runner/pooled.py picks one per machine:
#   grader:cpu      jobs without a GPU, amd64 + arm64
#   grader:cuda     GPU jobs on x86 cards and DGX Spark (GB10), amd64 + arm64, CUDA 13
#   grader:l4t-r36  GPU jobs on a Jetson (JetPack 6, L4T r36), arm64
# Each is also tagged <flavor>-<short sha> (pin with GYMHUB_GRADER_VERSION=<short sha>).
# A pull request only builds the cpu image and grades one exercise in it, without pushing.
name: grader-images

on:
  push:
    branches: [main]
    paths:
      - gymkit/**
      - gpu_gym/**
      - deploy/grader/**
      - .github/workflows/grader-images.yml
  pull_request:
    paths:
      - gymkit/**
      - gpu_gym/**
      - deploy/grader/**
      - gymhub/runner/pooled.py
      - .github/workflows/grader-images.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/grader

jobs:
  smoke:
    # The cpu image, as a pool agent runs it: read-only root, no network, an unprivileged uid, the
    # gym slice and the submission at /work. Grades one algo exercise.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/grader/Dockerfile.cpu
          platforms: linux/amd64
          load: true
          tags: grader:smoke
          cache-from: type=gha,scope=grader-cpu
      - name: Grade an exercise inside the image
        run: |
          work=$(mktemp -d) out=$(mktemp -d)
          mkdir -p "$work/gyms" "$work/job"
          cp -r gyms/algo "$work/gyms/algo"
          rm -rf "$work"/gyms/algo/problems/*/solution
          cat > "$work/job/solution.py" <<'EOF'
          def solve(a: str, b: str) -> int:
              prev = list(range(len(b) + 1))
              for i, ca in enumerate(a, 1):
                  cur = [i]
                  for j, cb in enumerate(b, 1):
                      cur.append(min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (ca != cb)))
                  prev = cur
              return prev[-1]
          EOF
          echo '{"version": 1, "exercises": {}}' > "$work/job/progress.json"
          chmod -R a+rX "$work" && chmod a+rwx "$out"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 12345:12345 --tmpfs /tmp -v "$work:/work:ro" -v "$out:/outputs" \
            -e POOL_WORK=/work -e POOL_OUTPUTS=/outputs grader:smoke sh -c \
            'cd "$POOL_WORK" && export PYTHONPATH="$POOL_WORK${PYTHONPATH:+:$PYTHONPATH}" GYMKIT_PROGRESS_FILE="$POOL_OUTPUTS/progress.json" && cp job/progress.json "$POOL_OUTPUTS/progress.json" && exec python3 -m gymkit gyms/algo test edit_distance --lang python --file job/solution.py'
          grep -q '"last_status": "pass"' "$out/progress.json"

  build:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            file: deploy/grader/Dockerfile.cpu
            platforms: linux/amd64,linux/arm64
            cache: true
          - flavor: cuda
            file: deploy/grader/Dockerfile.cuda
            # amd64 only: arm64 under QEMU timed out (torch + CUDA devel). The repo is private, so
            # there are no free native arm64 runners; a Spark builds its own arm64 image
            # (deploy/grader/build-local.sh) under the same tag, and the agent uses it without pulling.
            platforms: linux/amd64
            cache: false # several GB per arch: more than the Actions cache holds
          - flavor: l4t-r36
            file: deploy/grader/Dockerfile.l4t
            platforms: linux/arm64
            cache: false
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the CUDA and L4T bases are large)
        if: matrix.flavor != 'cpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ matrix.flavor }}
            ${{ env.IMAGE }}:${{ matrix.flavor }}-${{ steps.tags.outputs.short }}
          cache-from: ${{ matrix.cache && format('type=gha,scope=grader-{0}', matrix.flavor) || '' }}
          cache-to: ${{ matrix.cache && format('type=gha,mode=max,scope=grader-{0}', matrix.flavor) || '' }}
