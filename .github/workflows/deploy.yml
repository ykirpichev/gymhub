# Deploys the board. Staging (gymhub-board-staging) after every push to main whose tests passed;
# production when a tag v* is pushed (its commit must have passed the tests on main), or by hand
# (Actions tab > deploy > Run workflow > target: production).
# Credentials come from Workload Identity Federation (deploy/gcp.sh github-ci): no key is stored here.
name: deploy

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which board to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  actions: read # a tag deploy checks that the tests passed for its commit
  id-token: write # GitHub's OIDC token, exchanged for short-lived Google credentials

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Only pushes to this repository: a fork's pull request from a branch named main also matches
    # `branches: [main]`, and this workflow runs with the repository's credentials.
    # Skipped until deploy/gcp.sh github-ci has set the repository variables.
    if: >-
      vars.GCP_WIF_PROVIDER != '' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET: ${{ github.event_name == 'push' && 'production' || github.event.inputs.target || 'staging' }}
    steps:
      - name: Tests passed for the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        # Only a commit whose tests ran green on a push to main goes to production. A tag pushed right
        # after its commit waits for those tests (up to 40 minutes).
        run: |
          for _ in $(seq 80); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$SHA&event=push&branch=main" \
              --jq '[.workflow_runs[] | "\(.status) \(.conclusion)"] | first // "none"')"
            case "$state" in
              "completed success") echo "Tests passed on main for $SHA."; exit 0 ;;
              none) echo "::error::$SHA was never pushed to main (no tests run for it); not deploying a tag of it."; exit 1 ;;
              completed*) echo "::error::Tests for $SHA on main ended: $state. Not deploying."; exit 1 ;;
            esac
            echo "Tests for $SHA: $state; waiting."
            sleep 30
          done
          echo "::error::Tests for $SHA did not finish in time."; exit 1
      - uses: actions/checkout@v4
        with:
          # The commit whose tests passed, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Settings
        env:
          GCP_ENV: ${{ secrets.GCP_ENV }}
        run: printf '%s\n' "$GCP_ENV" > deploy/gcp.env
      - name: Deploy
        env:
          DEPLOY_CI: "1"
          PYTHON: python
        run: |
          if [ "$TARGET" = production ]; then deploy/gcp.sh deploy; else deploy/gcp.sh deploy staging; fi
