[package]
name = "pool-iroh"
version = "0.1.0"
edition = "2021"
description = "iroh-blobs sidecar for pool agents: peer chunk transfer over QUIC, authorized by server-signed tickets"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
iroh = "1"
iroh-blobs = "0.105"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
strip = true
